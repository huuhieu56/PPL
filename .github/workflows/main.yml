name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv pip install --system --torch-backend cpu -r requirements.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy tracked source and restart app
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
        run: |
          git archive HEAD | ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" 'tar -xf - -C /opt/ppl-rag'
          ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" 'test -f /opt/ppl-rag/.env && sudo -n systemctl restart ppl-rag && sudo -n systemctl is-active --quiet ppl-rag'
      - name: Verify HTTPS health
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: curl --fail --show-error --silent --retry 10 --retry-delay 3 --retry-connrefused "https://$APP_DOMAIN/_stcore/health"
