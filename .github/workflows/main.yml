name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv pip install --system --torch-backend cpu -r requirements.txt pytest==9.1.1 sentence-transformers==6.0.1
      - run: python -m pytest -q
      - run: docker build -t "ppl-rag:$GITHUB_SHA" .

      - name: Deploy image to VM
        if: vars.VM_HOST != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          set -euo pipefail
          : "${VM_HOST:?Set VM_HOST}" "${VM_USER:?Set VM_USER}" "${VM_SSH_KEY:?Set VM_SSH_KEY}" "${APP_ENV:?Set APP_ENV}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          docker save "ppl-rag:$GITHUB_SHA" | gzip -1 > "ppl-rag-image-$GITHUB_SHA.tar.gz"
          scp -o StrictHostKeyChecking=accept-new compose.yaml Caddyfile "ppl-rag-image-$GITHUB_SHA.tar.gz" "$VM_USER@$VM_HOST:/opt/ppl-rag/"
          printf '%s\n' "$APP_ENV" | ssh "$VM_USER@$VM_HOST" 'umask 077; cat > /opt/ppl-rag/.env.next && mv -f /opt/ppl-rag/.env.next /opt/ppl-rag/.env'
          ssh "$VM_USER@$VM_HOST" "IMAGE_TAG=$GITHUB_SHA sh -se" <<'REMOTE'
          cd /opt/ppl-rag
          docker load -i "ppl-rag-image-$IMAGE_TAG.tar.gz"
          rm -f "ppl-rag-image-$IMAGE_TAG.tar.gz"
          docker compose -p ppl-rag up -d --no-build --remove-orphans
          docker compose -p ppl-rag ps
          REMOTE
