corpus_version: ""
index_dir: ""
queries: data/benchmark/queries.jsonl
qrels: data/benchmark/qrels.jsonl
runs_dir: runs
seed: 42
ks: [1, 3, 5, 10]
embedding_model: BAAI/bge-m3
reranker_model: BAAI/bge-reranker-v2-m3
tokenizer: whitespace

experiments:
  E0: {method: bm25, use_reranker: false}
  E1: {method: dense, use_reranker: false}
  E2: {method: rrf, rrf_k: 60, use_reranker: false}
  E3: {method: weighted, alpha: 0.5, use_reranker: false}
  E4: {method: rrf, rrf_k: 60, use_reranker: true}
  E5: {method: weighted, alpha: 0.5, use_reranker: true}
  E6: {method: adaptive, alpha: 0.5, use_reranker: false}
  E7: {method: adaptive, alpha: 0.5, use_reranker: true}

retrieval:
  top_l: 100
  rerank_n: 20
  context_k: 5
