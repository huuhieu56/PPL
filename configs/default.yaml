chunking:
  strategy: structure
  max_words: 350
  overlap_words: 50
  chunk_words: 450
  fixed_overlap_words: 75
  prefix: true

index:
  embedding_model: BAAI/bge-m3
  tokenizers: [whitespace, pyvi]
  dense_backend: numpy
  bm25_k1: 1.5
  bm25_b: 0.75

pipeline:
  fusion: weighted
  alpha: 0.5
  rrf_k: 60
  adaptive_beta: 0.3
  rerank: true
  rerank_n: 30
  top_l: 100
  context_k: 5
  tokenizer: whitespace
  reranker_model: BAAI/bge-reranker-v2-m3
